name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore NixToUny.sln

      - name: Build
        run: dotnet build NixToUny.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test NixToUny.sln --configuration Release --no-build --verbosity normal
